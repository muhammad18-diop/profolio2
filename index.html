<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouhamed Diop | Développeur Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body class="bg-white text-gray-800">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-green-100 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- LOGO -->
            <a href="index.html" class="text-2xl font-bold text-green-700">
                Mouhamed<span class="text-green-500">.dev</span>
            </a>

            <!-- MENU DESKTOP -->
            <div class="hidden md:flex items-center gap-8 font-medium">
                <a href="index.html" class="hover:text-green-600 transition">Accueil</a>
                <a href="about.html" class="hover:text-green-600 transition">À propos</a>
                <a href="projects.html" class="hover:text-green-600 transition">Projets</a>
                <a href="contact.html" class="hover:text-green-600 transition">Contact</a>
            </div>

            <!-- BURGER MOBILE -->
            <button id="menu-btn" class="md:hidden relative w-10 h-10 flex flex-col justify-center items-center gap-1.5 text-green-700 transition">
                <span id="line1" class="w-7 h-0.5 bg-green-700 transition duration-300"></span>
                <span id="line2" class="w-7 h-0.5 bg-green-700 transition duration-300"></span>
                <span id="line3" class="w-7 h-0.5 bg-green-700 transition duration-300"></span>
            </button>
        </div>

        <!-- MENU MOBILE -->
        <div id="mobile-menu" class="md:hidden overflow-hidden max-h-0 transition-all duration-500 ease-in-out bg-white">
            <div class="px-6 py-6 flex flex-col gap-5 border-t border-green-100">
                <a href="index.html" class="mobile-link opacity-0 translate-y-3 transition duration-300 hover:text-green-600">Accueil</a>
                <a href="about.html" class="mobile-link opacity-0 translate-y-3 transition duration-300 hover:text-green-600">À propos</a>
                <a href="projects.html" class="mobile-link opacity-0 translate-y-3 transition duration-300 hover:text-green-600">Projets</a>
                <a href="contact.html" class="mobile-link opacity-0 translate-y-3 transition duration-300 hover:text-green-600">Contact</a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="min-h-screen flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div data-aos="fade-right">
                <p class="text-green-600 font-semibold mb-4">Bonjour je suis</p>
                <h1 class="text-5xl md:text-6xl font-bold leading-tight">
                    Mouhamed Diop <br>
                    <span class="text-green-700">Développeur Web</span>
                </h1>
                <p class="mt-6 text-gray-600 text-lg">
                    Je crée des applications web modernes, performantes et adaptées aux besoins des entreprises.
                </p>
                <div class="mt-8 flex gap-4">
                    <a href="projects.html" class="bg-green-600 text-white px-7 py-3 rounded-xl hover:bg-green-700 transition">Voir mes projets</a>
                    <a href="contact.html" class="border border-green-600 text-green-700 px-7 py-3 rounded-xl hover:bg-green-50 transition">Me contacter</a>
                </div>
            </div>

            <div data-aos="zoom-in" class="flex justify-center">
                <div class="w-80 h-80 rounded-full bg-green-100 flex items-center justify-center">
                    <img src="imagemouhamed.jpg" class="w-72 h-72 object-cover rounded-full" alt="Mouhamed Diop">
                </div>
            </div>
        </div>
    </section>

    <!-- SCRIPTS EN BAS DE PAGE -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <script>
        // Initialisation du menu mobile
        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const line1 = document.getElementById("line1");
        const line2 = document.getElementById("line2");
        const line3 = document.getElementById("line3");
        const links = document.querySelectorAll(".mobile-link");

        let open = false;

        menuBtn.addEventListener("click", () => {
            open = !open;

            if (open) {
                mobileMenu.style.maxHeight = mobileMenu.scrollHeight + "px";
                line1.classList.add("rotate-45", "translate-y-2");
                line2.classList.add("opacity-0");
                line3.classList.add("-rotate-45", "-translate-y-2");

                links.forEach((link, index) => {
                    setTimeout(() => {
                        link.classList.remove("opacity-0", "translate-y-3");
                    }, index * 100);
                });
            } else {
                mobileMenu.style.maxHeight = "0px";
                line1.classList.remove("rotate-45", "translate-y-2");
                line2.classList.remove("opacity-0");
                line3.classList.remove("-rotate-45", "-translate-y-2");

                links.forEach(link => {
                    link.classList.add("opacity-0", "translate-y-3");
                });
            }
        });

        // Initialisation de AOS
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
